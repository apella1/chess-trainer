[project]
name = "chess-trainer-worker"
version = "0.1.0"
description = "Chess Trainer background worker: analysis, puzzles, LLM reviews"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary,pool]>=3.2.3",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "engine: tests that require Stockfish on PATH",
    "db: tests that require a real Postgres database",
]
