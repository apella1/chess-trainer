services:

  postgres:
    image: postgres:16
    networks:
      - chess_trainer_net
    environment:
      POSTGRES_USER: ${DB_USER:-chess_trainer}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-chess_trainer}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-chess_trainer} -d ${DB_NAME:-chess_trainer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build: ./api
    networks:
      - chess_trainer_net
    ports:
      - "8084:8084"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chess_trainer}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-chess_trainer}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SPRING_FLYWAY_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-chess_trainer}
      SPRING_FLYWAY_USER: ${DB_USER:-chess_trainer}
      SPRING_FLYWAY_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      SERVER_PORT: 8084
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8084/actuator/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  worker:
    build: ./worker
    networks:
      - chess_trainer_net
    # Maps host.docker.internal to the host's gateway IP so the worker
    # can reach Ollama running natively on the host machine.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_URL: postgresql://${DB_USER:-chess_trainer}:${DB_PASSWORD:?DB_PASSWORD is required}@postgres:5432/${DB_NAME:-chess_trainer}
      STOCKFISH_PATH: ${STOCKFISH_PATH:-/usr/games/stockfish}
      ANALYSIS_DEPTH: ${ANALYSIS_DEPTH:-14}
      ANALYSIS_MULTIPV: ${ANALYSIS_MULTIPV:-3}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3:8b}
      REVIEW_PROMPT_VERSION: ${REVIEW_PROMPT_VERSION:-v1}
      WORKER_POLL_SECONDS: ${WORKER_POLL_SECONDS:-5}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  web:
    build: ./web
    networks:
      - chess_trainer_net
    ports:
      - "5176:5176"
    environment:
      # Vite proxy target uses the "api" service name via Compose DNS
      VITE_API_PROXY_TARGET: http://api:8084
    depends_on:
      - api
    restart: unless-stopped

networks:
  chess_trainer_net:
    name: chess_trainer_net
    driver: bridge

volumes:
  pgdata:
